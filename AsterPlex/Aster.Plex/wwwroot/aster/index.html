<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aster for Plex</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <div>
        <h1>Aster for Plex</h1>
        <p id="server-line" class="muted"></p>
      </div>
    </div>
    <div id="who" class="who" hidden>
      <span id="who-name"></span>
      <button id="sign-out" class="link">Sign out</button>
    </div>
  </header>

  <main id="main">
    <p class="muted">Loading…</p>
  </main>

  <dialog id="dialog">
    <form method="dialog" class="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="actions" id="dialog-actions">
        <button value="cancel" class="secondary">Close</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
