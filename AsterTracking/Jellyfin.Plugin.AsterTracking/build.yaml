name: "Aster Tracking"
guid: "023a7921-895e-40fb-b815-ab4462f68107"
version: "0.1.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "AsterMediaPlayer"
overview: "Tracking, scrobbling and discovery for Aster Media Player, and the switch for its Seerr requests."
description: >
  Aster Media Player's tracking plugin. Each person links their own Trakt, Simkl,
  AniList, MyAnimeList, Last.fm, ListenBrainz and Hardcover accounts, and what they
  play is scrobbled there from any app; Aster also shows those services' lists for
  discovery. It's also where requests are turned on: Aster's Seerr features stay off
  unless they're enabled here, with the Seerr server's address.
category: "General"
artifacts:
  - "Jellyfin.Plugin.AsterTracking.dll"
changelog: >
  - 0.1.0.0: First release: the switch for Aster's requests. A Requests (Seerr) setting with Seerr's address, which
    the apps read before showing their Seerr features. Tracking services follow in the next releases.
