# Pushing a tag like v0.1.0.0 builds the plugin, publishes a GitHub release with the zip, and records the version
# (with the zip's MD5) in manifest.json on main, which is what Jellyfin's plugin repository reads.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tag must match build.yaml
        run: |
          want="v$(sed -n 's/^version: *"\(.*\)" *$/\1/p' Jellyfin.Plugin.OpEd/build.yaml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != build.yaml $want"; exit 1; }

      - name: Build
        run: dotnet publish Jellyfin.Plugin.OpEd -c Release -o out

      - name: Package
        run: OPED_SKIP_BUILD=1 OPED_OUT="$PWD/out" bash scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(jq -r '.[0].versions[0].changelog' manifest.json)
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "OP/ED ${GITHUB_REF_NAME#v}" --notes "$notes"

      - name: Record the version in manifest.json on main
        run: |
          git fetch origin main
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: $GITHUB_REF_NAME [skip ci]" || echo "manifest unchanged"
          git push origin main
