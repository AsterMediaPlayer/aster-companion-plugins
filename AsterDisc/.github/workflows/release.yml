name: Release

# Push a tag like v0.1.0 to publish a release: a plugin zip and a plugin-repository manifest, both attached to a
# GitHub release. Jellyfin installs from the manifest at
#   https://github.com/<repo>/releases/latest/download/manifest.json
# Each release's manifest carries every earlier version too (the previous one is downloaded and added to), so a
# server can still pick an older version. See docs/RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pip install jprm jsonschema

      - name: The tag, build.yaml, Plugin.cs and the project agree
        run: python3 tools/check_release.py --tag "$TAG"

      - name: Test before releasing
        run: |
          dotnet test Jellyfin.Plugin.DiscMenus.Tests
          python3 tools/validate.py
          python3 -m unittest discover -s tools -p "test_*.py"

      - name: Build the plugin package
        run: |
          mkdir -p dist
          jprm plugin build Jellyfin.Plugin.DiscMenus --output "$PWD/dist"
          ls -l dist
          test "$(ls dist/*.zip | wc -l)" = 1

      - name: Add this version to the repository manifest
        run: |
          zip="$(ls dist/*.zip)"
          mkdir repo
          if curl -fsSL -o repo/manifest.json "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json"; then
            python3 -c 'import json,sys; json.load(open("repo/manifest.json"))'
          else
            echo "No earlier release: starting a new manifest."
            jprm repo init repo
          fi
          jprm repo add -U "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$zip")" repo "$zip"
          cat repo/manifest.json

      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; refusing to change it." >&2
            exit 1
          fi
          {
            python3 tools/check_release.py --notes
            echo
            echo "**Install:** in Jellyfin, Dashboard, Plugins, Repositories, add"
            echo '`https://github.com/'"$GITHUB_REPOSITORY"'/releases/latest/download/manifest.json`, then install **Disc Menus** from the catalogue and restart Jellyfin.'
            echo "It also needs the File Transformation plugin to show the menu button. Early alpha, and vibe coded: see the README."
          } > notes.md
          gh release create "$TAG" dist/*.zip repo/manifest.json --title "Disc Menus ${TAG#v}" --notes-file notes.md
