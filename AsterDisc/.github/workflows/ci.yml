name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin build and C# tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Jellyfin.Plugin.DiscMenus -c Release
      - name: Test
        run: dotnet test Jellyfin.Plugin.DiscMenus.Tests
      - name: Check the examples with the plugin's own loader
        run: dotnet run --project tools/MenuCheck -c Release -- examples/*.menu.json

  schemas:
    name: Schemas and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jsonschema
      - run: python3 tools/validate.py
      - name: Menu checker tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Check the examples with the menu checker
        run: python3 tools/menucheck.py examples/*.menu.json
      - name: Conformance vectors against the second (clean-room) implementation
        run: python3 conformance/python/run_vectors.py
      - name: The vectors catch small mistakes (mutation test)
        run: python3 conformance/python/mutants.py

  browser:
    name: Browser-code tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - working-directory: tests/js
        run: npm ci --no-audit --no-fund
      - working-directory: tests/js
        run: npm test

  package:
    name: Plugin package (what a release would publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pip install jprm
      - name: Release metadata agrees with itself
        run: python3 tools/check_release.py
      - name: Build the package
        run: |
          mkdir -p dist
          jprm plugin build Jellyfin.Plugin.DiscMenus --output "$PWD/dist"
      - name: The package is what Jellyfin expects
        run: |
          python3 - <<'PY'
          import glob, json, re, zipfile
          [path] = glob.glob("dist/*.zip")
          z = zipfile.ZipFile(path)
          assert sorted(z.namelist()) == ["Jellyfin.Plugin.DiscMenus.dll", "meta.json"], z.namelist()
          meta = json.loads(z.read("meta.json"))
          plugin = open("Jellyfin.Plugin.DiscMenus/Plugin.cs", encoding="utf-8").read()
          assert meta["guid"] == re.search(r'Guid\.Parse\("([^"]+)"\)', plugin).group(1), "meta.json guid differs from Plugin.cs"
          assert re.fullmatch(r"\d+\.\d+\.\d+\.\d+", meta["version"]) and meta["targetAbi"] == "12.0.0.0", meta
          print("package ok:", path, meta["version"])
          PY
      - name: A manifest can be made from it
        run: |
          mkdir repo
          jprm repo init repo
          jprm repo add -U "https://example.invalid/disc-menus.zip" repo dist/*.zip
          python3 -c 'import json; m = json.load(open("repo/manifest.json")); assert m[0]["versions"][0]["checksum"]; print("manifest ok")'
      - uses: actions/upload-artifact@v4
        with:
          name: disc-menus-package
          path: dist/*.zip

  real-browsers:
    name: Real-browser editing test (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - working-directory: tests/browser
        run: npm ci --no-audit --no-fund
      - working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: tests/browser
        run: npm test
