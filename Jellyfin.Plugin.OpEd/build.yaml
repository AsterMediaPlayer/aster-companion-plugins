name: "OP/ED"
guid: "d459e0a2-e073-4e1e-b0ec-71883075cf4a"
version: "0.1.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "peppy6582"
overview: "Anime opening and ending themes for your shows, with an API for clients."
description: >
  Indexes opening and ending theme files (video and/or audio) that you put in a
  themes folder, one folder per show, matches them to your Jellyfin shows and
  seasons, fills in song title, artists and episode ranges from AnimeThemes.moe,
  and serves them to clients through an authenticated API. Developed primarily
  with an AI coding assistant (Claude Code); see the README.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.OpEd.dll"
changelog: |
  - 0.1.1.0: Looks themes up through the AnimeThemes GraphQL API with the user agent agreed with them. Season picker and OP/ED number on approval, library picker and a length hint for the chapter clip review queue, previews that stay put while clips are being cut, credit to AnimeThemes in the README and settings page.
  - 0.1.0.0: First version. Indexes OP/ED theme files, matches them to shows and seasons, song details from AnimeThemes.moe, themes.json and file names, MP4/M4A copies for Apple TV, client API, and cutting missing OPs/EDs from episode chapters into a review queue.
