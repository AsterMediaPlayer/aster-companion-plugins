version: "0.1.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "peppy6582"
overview: "Make and edit Aster Media Player's TV channels from the dashboard."
description: >
  A Channels page in the Jellyfin dashboard for Aster Media Player. A channel is a
  video playlist tagged aster:channel, its settings more aster: tags on the same
  playlist; this page reads and writes those tags exactly as the app does, so the
  app, the page and tagging by hand all edit the same channels. It adds nothing
  else to the server.
category: "General"
artifacts:
  - "Jellyfin.Plugin.AsterChannels.dll"
changelog: >
  - 0.1.0.0: First release. A Channels page in the dashboard: the channel list, drag to renumber, a Basic and
    Advanced editor for every setting, and New Channel from a show, genre, network, collection or playlist.
