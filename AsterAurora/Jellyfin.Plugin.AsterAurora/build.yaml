name: "Aster Aurora"
guid: "22f5ff1c-c1cd-47b2-839f-25e6cd9c8afc"
version: "0.7.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "AsterMediaPlayer"
overview: "Apple TV style behaviour for the Jellyfin web client."
description: >
  Adds a rotating home hero banner, muted trailer backgrounds on details pages,
  card tilt and genre chips to jellyfin-web. Pairs with the Aurora custom CSS
  but works without it. Developed primarily with an AI coding assistant
  (Claude Code); see the README.
category: "General"
artifacts:
  - "Jellyfin.Plugin.AsterAurora.dll"
changelog: >
  - 0.7.0.0: A button beside the sound button clears the page away so only the trailer or opening shows (Escape, a click or a scroll brings the page back). While a video plays it is shaded once, lightly, instead of three times (Jellyfin's backdrop dimmer and the skin's shade step aside).
  - 0.6.1.0: No more second Back arrow in the dashboard (on plugin pages and other pages under it): Aurora's Back button stays hidden wherever Jellyfin's header already has one.
  - 0.6.0.0: Anime show pages loop their opening behind the page instead of a trailer, as the Aster app does, from the Aster OP/ED plugin (the season you'd watch next, never a spoiler or NSFW one), with its name beside the sound button. The video gets the skin's shade, the sound button moves up under the header, and local trailers send the token Jellyfin 12 accepts (ApiKey).
  - 0.5.0.0: Matches the Aster skin and app: its colours carry into Aurora's elements, episode pages are titled with the episode's own name and an "S2, E2" line, a started title shows how much is left and resumes from the banner, and Home's header gets its backing back once the page scrolls.
  - 0.4.0.0: Now Aster Aurora, installed from the Aster companion plugins repository. Same plugin id, so it updates in place, and your Aurora settings move across on first start.
  - 0.3.1.0: Back button in the top-left corner.
  - 0.3.0.0: No flashes: custom CSS applied from the first frame, banner placeholder, pre-paint genre chips, art-less layout keyed off the page, reserved badge space.
  - 0.2.2.0: Also hide the stock Next Up block before first paint; never touch non-show pages.
  - 0.2.1.0: No more flash of the stock season cards before the Episodes row loads.
  - 0.2.0.0: Up Next style rows, quality badges, Episodes row with season tabs.
  - 0.1.0.0: First version. Hero banner, trailer backgrounds, card tilt, genre chips.
