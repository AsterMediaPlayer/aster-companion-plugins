# Build tools for the Aurora Jellyfin plugin. Nothing here runs as a service: the plugin is a DLL that
# Jellyfin loads. Paths are HOST paths (compose resolves them on the UnRaid host, not in the agent container).
#
#   docker compose run --rm build      # -> /mnt/cache/appdata/jellyfin-aurora-build/Jellyfin.Plugin.Aurora.dll
services:
  build:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["tools"]
    working_dir: /src
    environment:
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_NOLOGO=1
      - AURORA_ARTIFACTS=/artifacts
      - NUGET_PACKAGES=/nuget
    command: dotnet publish Jellyfin.Plugin.Aurora -c Release -o /out
    volumes:
      - /boot/config/plugins/compose.manager/projects/jellyfin-aurora:/src:ro
      - aurora_artifacts:/artifacts
      - jellyfin-disc-menus_jdm_nuget:/nuget
      - /mnt/cache/appdata/jellyfin-aurora-build:/out

volumes:
  aurora_artifacts:
  jellyfin-disc-menus_jdm_nuget:
    external: true
