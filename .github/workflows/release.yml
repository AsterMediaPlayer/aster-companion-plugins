name: Release

# Push a tag like v0.1.0 to publish a release: the plugin zip and a plugin-repository manifest, both attached to a
# GitHub release. Jellyfin installs from the manifest at
#   https://github.com/<repo>/releases/latest/download/manifest.json
# Each release's manifest carries every earlier version too (the previous one is downloaded and added to).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install jprm

      - name: The tag, build.yaml, Plugin.cs and the project agree
        run: tools/check-versions.sh "$TAG"

      - name: Test before releasing
        run: node --test tests/*.test.js

      - name: Build the plugin package
        run: |
          mkdir -p dist
          jprm plugin build Jellyfin.Plugin.AsterChannels --output "$PWD/dist"
          ls -l dist
          test "$(ls dist/*.zip | wc -l)" = 1

      - name: Add this version to the repository manifest
        run: |
          zip="$(ls dist/*.zip)"
          mkdir repo
          if curl -fsSL -o repo/manifest.json "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json"; then
            python3 -c 'import json; json.load(open("repo/manifest.json"))'
          else
            echo "No earlier release: starting a new manifest."
            jprm repo init repo
          fi
          jprm repo add -U "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$zip")" repo "$zip"
          cat repo/manifest.json

      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; refusing to change it." >&2
            exit 1
          fi
          {
            echo "**Install:** in Jellyfin, Dashboard ▸ Plugins ▸ Repositories, add"
            echo '`https://github.com/'"$GITHUB_REPOSITORY"'/releases/latest/download/manifest.json`, then install **Aster Channels** from the catalogue and restart Jellyfin.'
            echo "Channels then appears in the dashboard menu."
          } > notes.md
          gh release create "$TAG" dist/*.zip repo/manifest.json --title "Aster Channels ${TAG#v}" --notes-file notes.md
