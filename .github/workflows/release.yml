name: Release

# Push a tag naming a plugin and its version to release it:
#   asterchannels-v0.1.2    asterdisc-v0.6.0    asteroped-v0.3.0    asteraurora-v0.4.0
# The plugin's zip is attached to a GitHub release, and the version is added to manifest.json on main: the one plugin
# repository for all of them. Every release also carries a copy of manifest.json, so
#   https://github.com/<repo>/releases/latest/download/manifest.json
# lists every plugin too. Older versions stay listed, so a server can pick one.
on:
  push:
    tags:
      - "asterchannels-v[0-9]+.[0-9]+.[0-9]+"
      - "asterdisc-v[0-9]+.[0-9]+.[0-9]+"
      - "asteroped-v[0-9]+.[0-9]+.[0-9]+"
      - "asteraurora-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

# One at a time, so two releases never write manifest.json at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install jprm jsonschema

      - name: Which plugin the tag names
        run: |
          case "$TAG" in
            asterchannels-v*) dir=AsterChannels; project=Jellyfin.Plugin.AsterChannels ;;
            asterdisc-v*) dir=AsterDisc; project=Jellyfin.Plugin.AsterDisc ;;
            asteroped-v*) dir=AsterOpEd; project=Jellyfin.Plugin.AsterOpEd ;;
            asteraurora-v*) dir=AsterAurora; project=Jellyfin.Plugin.AsterAurora ;;
            *) echo "unknown tag $TAG" >&2; exit 1 ;;
          esac
          echo "DIR=$dir" >> "$GITHUB_ENV"
          echo "PROJECT=$dir/$project" >> "$GITHUB_ENV"
          echo "VTAG=v${TAG#*-v}" >> "$GITHUB_ENV"

      - name: The tag, build.yaml, Plugin.cs and the project agree
        run: python3 tools/check_versions.py "$PROJECT" "$VTAG"

      - name: Test before releasing
        run: |
          case "$DIR" in
            AsterChannels)
              dotnet build "$PROJECT" -c Release
              node --test AsterChannels/tests/*.test.js ;;
            AsterDisc)
              cd AsterDisc
              dotnet test Jellyfin.Plugin.AsterDisc.Tests
              python3 tools/validate.py
              python3 -m unittest discover -s tools -p "test_*.py" ;;
            AsterOpEd)
              dotnet build "$PROJECT" -c Release ;;
            AsterAurora)
              dotnet build "$PROJECT" -c Release ;;
          esac

      - name: Build the plugin package
        run: |
          mkdir -p dist
          jprm plugin build "$PROJECT" --output "$PWD/dist"
          ls -l dist
          test "$(ls dist/*.zip | wc -l)" = 1

      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; refusing to change it." >&2
            exit 1
          fi
          name="$(python3 tools/check_versions.py "$PROJECT" --name)"
          {
            python3 tools/check_versions.py "$PROJECT" --notes
            echo
            echo "**Install:** in Jellyfin, Dashboard ▸ Plugins ▸ Repositories, add"
            echo '`https://raw.githubusercontent.com/'"$GITHUB_REPOSITORY"'/main/manifest.json`, then install **'"$name"'** from the catalogue and restart Jellyfin.'
          } > notes.md
          gh release create "$TAG" dist/*.zip --title "$name ${VTAG#v}" --notes-file notes.md

      - name: Add this version to manifest.json on main
        run: |
          zip="$(ls dist/*.zip)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          jprm repo add -U "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$zip")" . "$zip"
          python3 -c 'import json; json.load(open("manifest.json"))'
          git add manifest.json
          git commit -m "manifest: $TAG [skip ci]"
          git push origin main
          gh release upload "$TAG" manifest.json
