name: Aster for Plex image

# Push a tag to publish the container: asterplex-v0.1.0 publishes ghcr.io/<owner>/aster-plex:0.1.0 and :latest.
# A push to a branch other than main that changes AsterPlex/ publishes :dev instead, for testing with Aster's real
# apps (the secrets reach only workflows running on GitHub), with no GitHub release. So does running it by hand.
# (Its variables aren't called VERSION and the like: MSBuild reads the environment as properties, and a Version of
# "dev" breaks the build.)
# Aster's own apps on each service go into the image from the repository's Actions secrets, as for the Jellyfin
# plugin's release (see AsterPlex/Aster.Plex/BuiltInKeys.cs): only this workflow sees them, and only on a pushed tag.
on:
  push:
    tags:
      - "asterplex-v[0-9]+.[0-9]+.[0-9]+"
    branches-ignore:
      - main
    paths:
      - "AsterPlex/**"
      - ".github/workflows/plex-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The tag's version is the project's
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${TAG#asterplex-v}"
          project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' AsterPlex/Aster.Plex/Aster.Plex.csproj)
          if [ "$version" != "$project" ]; then
            echo "The tag says $version but Aster.Plex.csproj says $project." >&2
            exit 1
          fi
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_ALSO=latest" >> "$GITHUB_ENV"

      - name: A test image from a branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "IMAGE_VERSION=dev" >> "$GITHUB_ENV"
          echo "IMAGE_ALSO=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: dotnet test AsterPlex/Aster.Plex.Tests

      - name: Aster's apps are all there
        env:
          ASTER_SIMKL_CLIENT_ID: ${{ secrets.ASTER_SIMKL_CLIENT_ID }}
          ASTER_ANILIST_CLIENT_ID: ${{ secrets.ASTER_ANILIST_CLIENT_ID }}
          ASTER_MAL_CLIENT_ID: ${{ secrets.ASTER_MAL_CLIENT_ID }}
          ASTER_HARDCOVER_CLIENT_ID: ${{ secrets.ASTER_HARDCOVER_CLIENT_ID }}
          ASTER_LASTFM_API_KEY: ${{ secrets.ASTER_LASTFM_API_KEY }}
          ASTER_LASTFM_SHARED_SECRET: ${{ secrets.ASTER_LASTFM_SHARED_SECRET }}
        run: |
          for name in ASTER_SIMKL_CLIENT_ID ASTER_ANILIST_CLIENT_ID ASTER_MAL_CLIENT_ID ASTER_HARDCOVER_CLIENT_ID \
                      ASTER_LASTFM_API_KEY ASTER_LASTFM_SHARED_SECRET; do
            if [ -z "${!name}" ]; then
              echo "The $name secret isn't set; refusing to publish Aster for Plex without Aster's apps." >&2
              exit 1
            fi
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: The image's name, in lower case as GHCR wants
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aster-plex" >> "$GITHUB_ENV"

      # The keys are build arguments of the build stage only: the published image holds them in Aster.Plex.dll, as
      # any app holds its keys, but not in its history or environment.
      - uses: docker/build-push-action@v6
        with:
          context: AsterPlex
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE }}:${{ env.IMAGE_ALSO }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Aster for Plex
            org.opencontainers.image.licenses=GPL-3.0-only
          build-args: |
            ASTER_SIMKL_CLIENT_ID=${{ secrets.ASTER_SIMKL_CLIENT_ID }}
            ASTER_ANILIST_CLIENT_ID=${{ secrets.ASTER_ANILIST_CLIENT_ID }}
            ASTER_MAL_CLIENT_ID=${{ secrets.ASTER_MAL_CLIENT_ID }}
            ASTER_HARDCOVER_CLIENT_ID=${{ secrets.ASTER_HARDCOVER_CLIENT_ID }}
            ASTER_LASTFM_API_KEY=${{ secrets.ASTER_LASTFM_API_KEY }}
            ASTER_LASTFM_SHARED_SECRET=${{ secrets.ASTER_LASTFM_SHARED_SECRET }}

      - name: Publish the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$TAG" --title "Aster for Plex $IMAGE_VERSION" \
            --notes "Run it with \`docker pull ${IMAGE}:${IMAGE_VERSION}\`. See AsterPlex/README.md."
