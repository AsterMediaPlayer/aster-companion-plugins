name: CI

# Each plugin's checks run when its folder (or the shared tools) changes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.filter.outputs.channels }}
      disc: ${{ steps.filter.outputs.disc }}
      oped: ${{ steps.filter.outputs.oped }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            channels: ["AsterChannels/**", "tools/**", ".github/workflows/ci.yml"]
            disc: ["AsterDisc/**", "tools/**", ".github/workflows/ci.yml"]
            oped: ["AsterOpEd/**", "tools/**", ".github/workflows/ci.yml"]

  # ---- Aster Channels ----------------------------------------------------------

  channels:
    name: "Aster Channels: build, tag-rule vectors"
    needs: changes
    if: needs.changes.outputs.channels == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build AsterChannels/Jellyfin.Plugin.AsterChannels -c Release
      - name: The tag rules match the app's vectors
        run: node --test AsterChannels/tests/*.test.js
      - run: python3 tools/check_versions.py AsterChannels/Jellyfin.Plugin.AsterChannels

  # ---- Aster OP/ED --------------------------------------------------------------

  oped:
    name: "Aster OP/ED: build"
    needs: changes
    if: needs.changes.outputs.oped == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build AsterOpEd/Jellyfin.Plugin.AsterOpEd -c Release
      - run: python3 tools/check_versions.py AsterOpEd/Jellyfin.Plugin.AsterOpEd

  # ---- Aster Disc ---------------------------------------------------------------

  disc-plugin:
    name: "Aster Disc: build and C# tests"
    needs: changes
    if: needs.changes.outputs.disc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AsterDisc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Jellyfin.Plugin.AsterDisc -c Release
      - run: dotnet test Jellyfin.Plugin.AsterDisc.Tests
      - name: Check the examples with the plugin's own loader
        run: dotnet run --project tools/MenuCheck -c Release -- examples/*.menu.json

  disc-schemas:
    name: "Aster Disc: schemas, examples, conformance"
    needs: changes
    if: needs.changes.outputs.disc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AsterDisc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jsonschema
      - run: python3 tools/validate.py
      - name: Menu checker tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Check the examples with the menu checker
        run: python3 tools/menucheck.py examples/*.menu.json
      - name: Conformance vectors against the second (clean-room) implementation
        run: python3 conformance/python/run_vectors.py
      - name: The vectors catch small mistakes (mutation test)
        run: python3 conformance/python/mutants.py

  disc-browser:
    name: "Aster Disc: browser-code tests"
    needs: changes
    if: needs.changes.outputs.disc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AsterDisc/tests/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AsterDisc/tests/js/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  disc-real-browsers:
    name: "Aster Disc: real-browser editing (Chromium, Firefox, WebKit)"
    needs: changes
    if: needs.changes.outputs.disc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AsterDisc/tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AsterDisc/tests/browser/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test

  # ---- Every plugin: what a release would publish --------------------------------

  package:
    name: "Packages (what a release would publish)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pip install jprm
      - name: Build each plugin's package and a manifest from them
        run: |
          mkdir -p dist repo
          cp manifest.json repo/manifest.json
          for project in AsterChannels/Jellyfin.Plugin.AsterChannels AsterDisc/Jellyfin.Plugin.AsterDisc AsterOpEd/Jellyfin.Plugin.AsterOpEd; do
            python3 tools/check_versions.py "$project"
            out="dist/$(basename "$project")"
            mkdir -p "$out"
            jprm plugin build "$project" --output "$PWD/$out"
            zip="$(ls "$out"/*.zip)"
            unzip -l "$zip"
            jprm repo add -U "https://example.invalid/$(basename "$zip")" repo "$zip"
          done
          python3 -c 'import json; m = json.load(open("repo/manifest.json")); print([(p["name"], p["versions"][0]["version"]) for p in m])'
